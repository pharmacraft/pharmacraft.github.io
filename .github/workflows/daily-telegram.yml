name: PharmaCraft Daily Telegram

# Times are in UTC. 03:33 UTC = ~09:03 AM IST. (GitHub may still delay scheduled runs.)
on:
  schedule:
    - cron: '33 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Post daily MCQs (5 streams)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL:   ${{ secrets.CHANNEL }}
        run: python post_daily.py

      - name: Commit daily.json for the website
        run: |
          git config user.name "pharmacraft-bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily.json
          git commit -m "Update daily.json" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "Nothing to push"
