name: PharmaCraft Daily Telegram


# Triggered externally by cron-job.org at 09:00 AM IST (reliable, no GitHub scheduled delay).
# Manual runs also allowed from the Actions tab.
on:
  workflow_dispatch:


permissions:
  contents: write


jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Write and post today's 5 MCQs (Claude + no-repeat log)
        env:
          BOT_TOKEN:         ${{ secrets.BOT_TOKEN }}
          CHANNEL:           ${{ secrets.CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL:      ${{ vars.CLAUDE_MODEL }}
        run: python post_daily.py


      - name: Commit daily.json + mcq_log.json
        run: |
          git config user.name "pharmacraft-bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily.json mcq_log.json
          git commit -m "Daily MCQs $(date -u +%F)" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || echo "Nothing to push"
