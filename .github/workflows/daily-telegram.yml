name: PharmaCraft Daily Telegram

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Post daily MCQ and note
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL:   ${{ secrets.CHANNEL }}
        run: python post_daily.py
