name: PharmaCraft Daily Telegram

# Times are in UTC. 03:30 UTC = 09:00 AM IST.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pharmacraft-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write and post today's 5 MCQs (Claude + no-repeat log)
        env:
          BOT_TOKEN:         ${{ secrets.BOT_TOKEN }}
          CHANNEL:           ${{ secrets.CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL:      ${{ vars.CLAUDE_MODEL }}
        run: python post_daily.py

      - name: Save daily.json (website) and mcq_log.json (no-repeat log)
        run: |
          git config user.name "pharmacraft-bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily.json mcq_log.json
          git commit -m "Daily MCQs $(date -u +%F)" || echo "No changes to commit"
          git push || echo "Nothing to push"
